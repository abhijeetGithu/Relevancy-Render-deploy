# Search Relevancy Suite - Unified Render Blueprint
# Single application serving all tools under one domain:
#   /           -> Portal
#   /dataquery  -> DataQuery Engine
#   /llm        -> LLM Comparator
#   /relevancy  -> Relevancy Script

services:
  - type: web
    name: relevancy-suite
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.unified
    healthCheckPath: /health
    envVars:
      - key: DATAQUERY_URL
        value: "/dataquery/"
      - key: LLM_COMPARATOR_URL
        value: "/llm/"
      - key: RELEVANCY_SCRIPT_URL
        value: "/relevancy/"
      - key: PORTAL_URL
        value: "/"
      - key: GUNICORN_WORKERS
        value: 1
      - key: GUNICORN_TIMEOUT
        value: 1200
      - key: FLASK_DEBUG
        value: "false"
      # - key: OPENAI_API_KEY
      #   sync: false
