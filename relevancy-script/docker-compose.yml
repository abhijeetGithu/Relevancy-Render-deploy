version: '3.8'

services:
  relevancy-system:
    build:
      context: .
      dockerfile: Dockerfile
    image: relevancy-system:latest
    container_name: relevancy-system
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8006}:8006"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_HOST=0.0.0.0
      - PORT=8006
      - APP_WORKERS=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
